name: Public-evaluation QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permit-receipt-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONWARNINGS: "error"

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check setuptools==83.0.0 wheel==0.47.0
          python -m pip install --disable-pip-version-check --no-build-isolation -e . --no-deps
      - name: Strict tests and interoperability smoke
        run: |
          python -m pytest -q -p no:cacheprovider
          python run_vectors.py
          python ietf126/run_review_packet.py
          python ietf126/independent_recompute.py
          python ietf126/independent_crypto_verify.py

  release-gates:
    name: Reproducibility and release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock-py313-linux-x86_64.txt
      - name: Install the hash-locked evaluation environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock-py313-linux-x86_64.txt
          python -m pip install --disable-pip-version-check --no-build-isolation -e . --no-deps
      - name: Verify deterministic metadata is current
        run: |
          python tools/generate_supply_chain_metadata.py
          python tools/make_public_manifest.py
          git diff --exit-code -- attestations sbom.cdx.json MANIFEST.json MANIFEST.sha256.json
      - name: Run full release preflight
        run: make qa-full
      - name: Rebuild twice and compare exact bytes
        run: |
          rm -rf /tmp/permit-a /tmp/permit-b
          python tools/build_release_asset.py --out-dir /tmp/permit-a
          python tools/build_release_asset.py --out-dir /tmp/permit-b
          for suffix in \
            .zip \
            .zip.sha256 \
            .zip.manifest.json \
            .zip.provenance.json; do
            cmp "/tmp/permit-a/permit-receipt-ref-eval-v2_2_6-public-eval${suffix}" \
                "/tmp/permit-b/permit-receipt-ref-eval-v2_2_6-public-eval${suffix}"
          done
          python tools/verify_release_artifact.py \
            /tmp/permit-a/permit-receipt-ref-eval-v2_2_6-public-eval.zip \
            /tmp/permit-a/permit-receipt-ref-eval-v2_2_6-public-eval.zip.sha256 \
            --manifest /tmp/permit-a/permit-receipt-ref-eval-v2_2_6-public-eval.zip.manifest.json \
            --provenance /tmp/permit-a/permit-receipt-ref-eval-v2_2_6-public-eval.zip.provenance.json
