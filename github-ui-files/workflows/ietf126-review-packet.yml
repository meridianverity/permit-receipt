name: IETF 126 review packet

on:
  push:
    paths:
      - "ietf126/**"
      - "orprg_eval/**"
      - "tests/**"
      - "evaluation_vectors/**"
      - "github-ui-files/workflows/ietf126-review-packet.yml"
  pull_request:
    paths:
      - "ietf126/**"
      - "orprg_eval/**"
      - "tests/**"
      - "evaluation_vectors/**"
      - "github-ui-files/workflows/ietf126-review-packet.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONWARNINGS: "error"

jobs:
  packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock-py313-linux-x86_64.txt
      - name: Install hash-locked evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock-py313-linux-x86_64.txt
          python -m pip install --disable-pip-version-check --no-build-isolation -e . --no-deps
      - name: Run packet and independent checks
        run: |
          python ietf126/run_review_packet.py
          python ietf126/independent_recompute.py
          python ietf126/independent_crypto_verify.py
          python -m pytest -q tests/test_ietf126_authorization_ref_schema.py tests/test_ietf126_standalone_parity.py -p no:cacheprovider
